{% extends "public/_base.html" %}
{% block content %}
{% if skills %}
<ul>
  {% for skill in skills %}
  <li>{{ skill.name }}{% if skill.category %} <span class="badge">{{ skill.category }}</span>{% endif %}</li>
  {% endfor %}
</ul>
{% else %}
<p>No public skills listed yet.</p>
{% endif %}
{% endblock %}
