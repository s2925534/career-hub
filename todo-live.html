<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Career Hub &middot; Live TODO</title>
<style>
  :root {
    --bg: #EEF0EA; --surface: #FFFFFF; --surface-alt: #E4E7DE;
    --text: #1C2420; --text-muted: #5B6660; --border: #D3D8CC;
    --accent: #3E5C76; --done: #2F7A52; --pending: #A9812F; --err: #A23E3E;
    --shadow: 0 1px 2px rgba(28,36,32,.06), 0 6px 20px -8px rgba(28,36,32,.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12181A; --surface: #1B2326; --surface-alt: #212B2E;
      --text: #E7ECE7; --text-muted: #93A29B; --border: #2E3A3C;
      --accent: #8FB0D3; --done: #5FBE8A; --pending: #D8B168; --err: #E38080;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12181A; --surface: #1B2326; --surface-alt: #212B2E;
    --text: #E7ECE7; --text-muted: #93A29B; --border: #2E3A3C;
    --accent: #8FB0D3; --done: #5FBE8A; --pending: #D8B168; --err: #E38080;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #EEF0EA; --surface: #FFFFFF; --surface-alt: #E4E7DE;
    --text: #1C2420; --text-muted: #5B6660; --border: #D3D8CC;
    --accent: #3E5C76; --done: #2F7A52; --pending: #A9812F; --err: #A23E3E;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", "Consolas", "Roboto Mono", monospace; }
  .page { max-width: 820px; margin: 0 auto; padding: 2rem 1.25rem 4rem; display: flex; flex-direction: column; gap: 1.5rem; }
  header.masthead { display: flex; flex-direction: column; gap: .3rem; }
  .eyebrow { font-size: .72rem; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
  h1 { font-size: 1.6rem; margin: 0; font-weight: 600; }
  .dek { margin: 0; color: var(--text-muted); font-size: .92rem; }
  .status-bar { display: flex; align-items: center; gap: .5rem; font-size: .8rem; color: var(--text-muted); }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .live-dot.live { background: var(--done); animation: pulse 1.6s ease-in-out infinite; }
  .live-dot.error { background: var(--err); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(95,190,138,.5); }
    50% { box-shadow: 0 0 0 5px rgba(95,190,138,0); }
  }
  .summary { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 1.1rem 1.3rem; display: flex; align-items: center; gap: 1.1rem; }
  .ring { --pct: 0; width: 66px; height: 66px; border-radius: 50%; background: conic-gradient(var(--done) calc(var(--pct) * 1%), var(--surface-alt) 0); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ring-inner { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: .85rem; font-weight: 600; }
  .summary-text { font-size: .95rem; }
  .summary-text strong { color: var(--done); }
  #phases { display: flex; flex-direction: column; gap: 1.1rem; }
  .phase { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 1rem 1.1rem .4rem; }
  .phase-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: .6rem; }
  .phase-head h2 { font-size: 1rem; margin: 0; font-weight: 600; }
  .phase-progress { font-size: .76rem; color: var(--text-muted); }
  .phase-bar-track { height: 4px; border-radius: 999px; background: var(--surface-alt); overflow: hidden; margin-bottom: .7rem; }
  .phase-bar-fill { height: 100%; background: var(--done); transition: width .5s ease; }
  .item { display: grid; grid-template-columns: 1.3rem 1fr; gap: .6rem; align-items: start; padding: .45rem .3rem; border-top: 1px solid var(--border); }
  .item:first-of-type { border-top: none; }
  .item-mark { font-size: .9rem; }
  .item.done .item-mark { color: var(--done); }
  .item.pending .item-mark { color: var(--pending); }
  .item-text { font-size: .88rem; }
  .item.done .item-text { color: var(--text-muted); }
  .item.just-updated { animation: item-flash 2.4s ease; border-radius: 6px; }
  @keyframes item-flash {
    0%   { background: color-mix(in srgb, var(--accent) 28%, transparent); }
    100% { background: transparent; }
  }
  .error-box { background: var(--surface); border: 1px solid var(--err); border-radius: 12px; padding: 1rem 1.2rem; color: var(--err); font-size: .88rem; }
  footer { text-align: center; color: var(--text-muted); font-size: .76rem; }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div class="eyebrow mono">career-hub &middot; TODO.md</div>
    <h1>Live TODO</h1>
    <p class="dek">Polls <code>TODO.html</code> (auto-regenerated whenever TODO.md is edited) and flashes
      items the moment their checked state changes. Keep this tab open while coding.</p>
    <div class="status-bar mono">
      <span class="live-dot" id="live-dot"></span>
      <span id="status-text">connecting&hellip;</span>
    </div>
  </header>

  <div id="error-slot"></div>

  <section class="summary" id="summary-section" style="display:none">
    <div class="ring" id="ring"><div class="ring-inner mono" id="ring-pct">0%</div></div>
    <div class="summary-text mono" id="summary-text"></div>
  </section>

  <main id="phases"></main>

  <footer class="mono" id="footer-text">not yet loaded</footer>
</div>

<script>
  const POLL_MS = 3000;
  const errorSlot = document.getElementById('error-slot');
  const summarySection = document.getElementById('summary-section');
  const ringEl = document.getElementById('ring');
  const ringPctEl = document.getElementById('ring-pct');
  const summaryTextEl = document.getElementById('summary-text');
  const phasesEl = document.getElementById('phases');
  const liveDot = document.getElementById('live-dot');
  const statusText = document.getElementById('status-text');
  const footerText = document.getElementById('footer-text');

  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  const itemKey = (phaseTitle, item) => phaseTitle + '|' + item.text;

  let prevMap = null; // key -> done boolean, from the previous successful poll

  function setStatus(kind, message) {
    liveDot.classList.remove('live', 'error');
    if (kind === 'live') {
      liveDot.classList.add('live');
      statusText.textContent = 'watching TODO.html — last checked ' + new Date().toLocaleTimeString();
    } else if (kind === 'error') {
      liveDot.classList.add('error');
      statusText.textContent = 'error: ' + message;
    } else {
      statusText.textContent = message || 'connecting…';
    }
  }

  function showError(message) {
    errorSlot.innerHTML = `<div class="error-box">${message}</div>`;
  }

  function clearError() {
    errorSlot.innerHTML = '';
  }

  async function fetchTodoData() {
    const res = await fetch('./TODO.html?_=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) {
      throw new Error(`TODO.html returned HTTP ${res.status}. Edit TODO.md once to (re)generate it.`);
    }
    const html = await res.text();
    const dataMatch = html.match(/const DATA = (\[[\s\S]*?\]);\s*\n\s*const CATS/);
    if (!dataMatch) {
      throw new Error('Could not find the embedded task data in TODO.html — its format may have changed.');
    }
    return JSON.parse(dataMatch[1]);
  }

  function render(data, changedKeys) {
    let total = 0, done = 0;
    data.forEach(p => p.items.forEach(i => { total++; if (i.done) done++; }));
    const pct = total ? Math.round((done / total) * 100) : 0;

    summarySection.style.display = '';
    ringEl.style.setProperty('--pct', pct);
    ringPctEl.textContent = pct + '%';
    summaryTextEl.innerHTML = `<strong>${done}</strong> / ${total} tasks complete`;

    phasesEl.innerHTML = data.map((p) => {
      const pDone = p.items.filter(i => i.done).length;
      const pTotal = p.items.length;
      const pPct = pTotal ? Math.round((pDone / pTotal) * 100) : 0;
      const rows = p.items.map((item) => {
        const key = itemKey(p.title, item);
        const statusClass = item.done ? 'done' : 'pending';
        const flash = changedKeys.has(key) ? ' just-updated' : '';
        const mark = item.done ? '✓' : '○';
        return `<div class="item ${statusClass}${flash}">
          <span class="item-mark" aria-hidden="true">${mark}</span>
          <span class="item-text">${item.text}</span>
        </div>`;
      }).join('');
      return `<section class="phase" id="${slug(p.title)}">
        <div class="phase-head"><h2>${p.title}</h2><span class="phase-progress mono">${pDone}/${pTotal}</span></div>
        <div class="phase-bar-track"><span class="phase-bar-fill" style="width:${pPct}%"></span></div>
        ${rows}
      </section>`;
    }).join('');
  }

  async function poll() {
    try {
      const data = await fetchTodoData();
      const newMap = new Map();
      data.forEach(p => p.items.forEach(i => newMap.set(itemKey(p.title, i), i.done)));

      const changedKeys = new Set();
      if (prevMap) {
        newMap.forEach((doneNow, key) => {
          if (prevMap.has(key) && prevMap.get(key) !== doneNow) changedKeys.add(key);
        });
      }

      render(data, changedKeys);
      prevMap = newMap;
      clearError();
      setStatus('live');
      footerText.textContent = 'polling every ' + (POLL_MS / 1000) + 's — updated ' + new Date().toLocaleTimeString();
    } catch (err) {
      setStatus('error', err.message);
      showError(
        `${err.message}<br><br>If you opened this file directly (file://), some browsers block ` +
        `local fetches. Serve the folder instead, e.g.: <code>python3 -m http.server 8000</code> ` +
        `then open <code>http://localhost:8000/todo-live.html</code>.`
      );
    }
  }

  poll();
  setInterval(poll, POLL_MS);
</script>
</body>
</html>
